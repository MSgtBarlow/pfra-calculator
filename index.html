<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>USAF PFRA Calculator</title>

  <style>
    :root {
      --blue: #003f72;
      --blue-dark: #002c50;
      --light-blue: #eaf3f8;
      --border: #c8d3dc;
      --green: #176b3a;
      --green-bg: #dff4e6;
      --red: #9a1c1c;
      --red-bg: #fae4e4;
      --yellow-bg: #fff6cf;
      --yellow-text: #695000;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      padding: 24px;
      background: #f1f4f6;
      color: #18232c;
      font-family: Arial, Helvetica, sans-serif;
    }

    .container {
      max-width: 950px;
      margin: auto;
      overflow: hidden;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0 4px 18px rgba(0,0,0,.12);
    }

    header {
      padding: 28px 24px;
      color: #fff;
      text-align: center;
      background: var(--blue);
    }

      }

      header h1 {
        margin: 0 0 8px;
        font-size: 1.45rem;
      }

      header p { margin: 0; }

      main { padding: 24px; }

      .section {
        margin-bottom: 22px;
        padding: 20px;
        border: 1px solid var(--border);
        border-radius: 8px;
      }

    .section h2 {
      margin: 0 0 14px;
      padding-bottom: 10px;
      color: var(--blue);
      border-bottom: 2px solid var(--blue);
      font-size: 1.1rem;
    }

    .note {
      color: #56636c;
      font-size: .9rem;
      line-height: 1.4;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 16px;
    }

    .field {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    label {
      font-size: .92rem;
      font-weight: 700;
    }

    input, select {
      width: 100%;
      padding: 10px;
      border: 1px solid #9baab5;
      border-radius: 5px;
      background: #fff;
      font-size: 1rem;
    }

    input:focus, select:focus {
      outline: 2px solid #8abbd9;
      border-color: var(--blue);
    }

    .conditional {
      display: none;
      margin-top: 16px;
      padding: 16px;
      border-left: 4px solid var(--blue);
      background: var(--light-blue);
    }

    button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 6px;
      color: #fff;
      cursor: pointer;
      background: var(--blue);
      font-size: 1rem;
      font-weight: 700;
    }

    button:hover { background: var(--blue-dark); }

    .results {
      display: none;
      margin-top: 24px;
      padding: 20px;
      border: 2px solid var(--blue);
      border-radius: 8px;
    }

    .results h2 {
      margin-top: 0;
      color: var(--blue);
      text-align: center;
    }

    table {
      width: 100%;
      margin: 16px 0;
      border-collapse: collapse;
    }

    th, td {
      padding: 11px;
      text-align: left;
      border-bottom: 1px solid var(--border);
    }

    th { background: var(--light-blue); }

    .points {
      text-align: right;
      font-weight: 700;
    }

    .good, .bad, .warning {
      margin-top: 16px;
      padding: 14px;
      border-radius: 6px;
      line-height: 1.4;
      font-weight: 700;
    }

    .good {
      color: var(--green);
      background: var(--green-bg);
      border: 1px solid #86c99d;
    }

    .bad {
      color: var(--red);
      background: var(--red-bg);
      border: 1px solid #db8d8d;
    }

    .warning {
      color: var(--yellow-text);
      background: var(--yellow-bg);
      border: 1px solid #ddc467;
    }

    @media (max-width: 600px) {
      body { padding: 10px; }
      main { padding: 14px; }
    }
  </style>
</head>

<body>
  <div class="container">
    <header>
      <h1>USAF Physical Fitness Readiness Assessment Calculator</h1>
      <p>General PFRA — Direct Published-Threshold Lookup</p>
    </header>

    <main>
      <form id="pfraForm">

        <section class="section">
          <h2>Member Information</h2>

          <div class="grid">
            <div class="field">
              <label for="age">Age</label>
              <input id="age" type="number" min="17" max="80" required />
            </div>

            <div class="field">
              <label for="sex">Sex</label>
              <select id="sex" required>
                <option value="">Select</option>
                <option value="M">Male</option>
                <option value="F">Female</option>
              </select>
            </div>

            <div class="field">
              <label for="height">Height (inches)</label>
              <input id="height" type="number" min="48" max="96" step="0.1" required />
            </div>

            <div class="field">
              <label for="waist">Waist (inches)</label>
              <input id="waist" type="number" min="18" max="70" step="0.1" required />
            </div>
          </div>
        </section>

        <section class="section">
          <h2>Cardiorespiratory Fitness</h2>

          <div class="field">
            <label for="cardioType">Select Event</label>
            <select id="cardioType">
              <option value="run">2-Mile Run</option>
              <option value="hamr">20-Meter HAMR</option>
              <option value="walk">2.0-Kilometer Walk</option>
            </select>
          </div>

          <div id="runFields" class="conditional" style="display:block;">
            <div class="grid">
              <div class="field">
                <label for="runMinutes">Run Minutes</label>
                <input id="runMinutes" type="number" min="0" max="60" />
              </div>

              <div class="field">
                <label for="runSeconds">Run Seconds</label>
                <input id="runSeconds" type="number" min="0" max="59" />
              </div>
            </div>
          </div>

          <div id="hamrFields" class="conditional">
            <div class="field">
              <label for="hamrShuttles">Shuttles Completed</label>
              <input id="hamrShuttles" type="number" min="0" max="200" />
            </div>
          </div>

          <div id="walkFields" class="conditional">
            <div class="grid">
              <div class="field">
                <label for="walkMinutes">Walk Minutes</label>
                <input id="walkMinutes" type="number" min="0" max="60" />
              </div>

              <div class="field">
                <label for="walkSeconds">Walk Seconds</label>
                <input id="walkSeconds" type="number" min="0" max="59" />
              </div>
            </div>
          </div>
        </section>

        <section class="section">
          <h2>Muscular Strength</h2>

          <div class="grid">
            <div class="field">
              <label for="strengthType">Select Event</label>
              <select id="strengthType">
                <option value="pushup">One-Minute Push-ups</option>
                <option value="hrpu">Hand-Release Push-ups</option>
              </select>
            </div>

            <div class="field">
              <label for="strengthReps">Repetitions Completed</label>
              <input id="strengthReps" type="number" min="0" max="150" required />
            </div>
          </div>
        </section>

        <section class="section">
          <h2>Core Endurance</h2>

          <div class="field">
            <label for="coreType">Select Event</label>
            <select id="coreType">
              <option value="situp">One-Minute Sit-ups</option>
              <option value="crunch">Cross-Leg Reverse Crunches</option>
              <option value="plank">Timed Forearm Plank</option>
            </select>
          </div>

          <div id="coreRepFields" class="conditional" style="display:block;">
            <div class="field">
              <label for="coreReps">Repetitions Completed</label>
              <input id="coreReps" type="number" min="0" max="150" />
            </div>
          </div>

          <div id="plankFields" class="conditional">
            <div class="grid">
              <div class="field">
                <label for="plankMinutes">Plank Minutes</label>
                <input id="plankMinutes" type="number" min="0" max="10" />
              </div>

              <div class="field">
                <label for="plankSeconds">Plank Seconds</label>
                <input id="plankSeconds" type="number" min="0" max="59" />
              </div>
            </div>
          </div>
        </section>

        <button type="submit">Calculate PFRA Score</button>
      </form>

      <section id="results" class="results" aria-live="polite"></section>
    </main>
  </div>

  <script>

    ];

    const SITUP_TABLE = [
      { points: 15.0, thresholds: [58,54,56,50,54,45,52,43,50,41,48,35,46,34,44,32,42,31] },

      { points: 13.0, thresholds: [54,50,52,46,50,41,48,39,46,37,44,31,42,30,40,28,38,27] },
      { points: 12.5, thresholds: [53,49,51,45,49,40,47,38,45,36,43,30,41,29,39,27,37,26] },
      { points: 12.0, thresholds: [52,48,50,44,48,39,46,37,44,35,42,29,40,28,38,26,36,25] },

      { points: 4.0, thresholds: [36,32,34,28,32,23,30,21,28,19,26,13,24,12,22,10,20,9] },
      { points: 3.5, thresholds: [35,31,33,27,31,22,29,20,27,18,25,12,23,11,21,9,19,8] },
      { points: 3.0, thresholds: [34,30,32,26,30,21,28,19,26,17,24,11,22,10,20,8,18,7] },
      { points: 2.5, thresholds: [33,29,31,25,29,20,27,18,25,16,23,10,21,9,19,7,17,6] }
    ];

    function getAgeBandIndex(age) {
      return AGE_BANDS.findIndex(band => age >= band.min && age <= band.max);
    }

    function getColumn(age, sex) {
      return (getAgeBandIndex(age) * 2) + (sex === "M" ? 0 : 1);
    }

    function timeToSeconds(minutes, seconds) {
      return (Number(minutes) * 60) + Number(seconds);
    }

    function formatTime(totalSeconds) {
      const minutes = Math.floor(totalSeconds / 60);
      const seconds = totalSeconds % 60;
      return `${minutes}:${String(seconds).padStart(2, "0")}`;
    }


    function lookupTimedScore(table, actualSeconds, column) {
      for (const row of table) {
        if (actualSeconds <= row.thresholds[column]) {
          return row.points;
        }
      }
      return 0.0;
    
    }


    function lookupPerformanceScore(table, performance, column) {
      for (const row of table) {
        if (performance >= row.thresholds[column]) {
          return row.points;
        }
      }
      return 0.0;
    }

    function getWHtRPoints(ratio) {
      return WHTR_TABLE.find(row => ratio <= row.max).points;
    }

    function setCardioFields() {
      const type = document.getElementById("cardioType").value;

      document.getElementById("runFields").style.display =
        type === "run" ? "block" : "none";

      document.getElementById("hamrFields").style.display =
        type === "hamr" ? "block" : "none";

      document.getElementById("walkFields").style.display =
        type === "walk" ? "block" : "none";
    }

    function setCoreFields() {
      const isPlank = document.getElementById("coreType").value === "plank";

      document.getElementById("coreRepFields").style.display =
        isPlank ? "none" : "block";

      document.getElementById("plankFields").style.display =
        isPlank ? "block" : "none";
    }

    document.getElementById("cardioType").addEventListener("change", setCardioFields);
    document.getElementById("coreType").addEventListener("change", setCoreFields);

    document.getElementById("pfraForm").addEventListener("submit", event => {
      event.preventDefault();

      const age = Number(document.getElementById("age").value);
      const sex = document.getElementById("sex").value;
      const height = Number(document.getElementById("height").value);
      const waist = Number(document.getElementById("waist").value);

      if (!age || !sex || !height || !waist) {
        alert("Complete all member-information fields.");
        return;
      }

      const results = document.getElementById("results");
      const ageBand = getAgeBandIndex(age);
      const column = getColumn(age, sex);

      const whtr = Math.floor((waist / height) * 100) / 100;
      const whtrPoints = getWHtRPoints(whtr);

      let cardioPoints = 0;
      let cardioDescription = "";
      let cardioPassed = false;

      const cardioType = document.getElementById("cardioType").value;

      if (cardioType === "run") {
        const minutes = Number(document.getElementById("runMinutes").value);
        const seconds = Number(document.getElementById("runSeconds").value);

        if (seconds < 0 || seconds > 59 || !Number.isFinite(minutes)) {
          alert("Enter a valid 2-mile run time.");
          return;
        }

        const totalSeconds = timeToSeconds(minutes, seconds);
        cardioPoints = lookupTimedScore(RUN_TABLE, totalSeconds, column);
        cardioPassed = cardioPoints >= 35.0;
        cardioDescription = `2-Mile Run: ${formatTime(totalSeconds)}`;

      } else if (cardioType === "hamr") {
        const shuttles = Number(document.getElementById("hamrShuttles").value);

        if (!Number.isFinite(shuttles)) {
          alert("Enter a valid HAMR shuttle count.");
          return;
        }

        cardioPoints = lookupPerformanceScore(HAMR_TABLE, shuttles, column);
        cardioPassed = cardioPoints >= 35.0;
        cardioDescription = `20-Meter HAMR: ${shuttles} shuttles`;

      } else {
        const minutes = Number(document.getElementById("walkMinutes").value);
        const seconds = Number(document.getElementById("walkSeconds").value);

        if (seconds < 0 || seconds > 59 || !Number.isFinite(minutes)) {
          alert("Enter a valid 2.0-kilometer walk time.");
          return;
        }

        const walkSeconds = timeToSeconds(minutes, seconds);
        const maximumPassingTime = WALK_PASS_TIMES[sex][ageBand];

        cardioPassed = walkSeconds <= maximumPassingTime;
        cardioPoints = cardioPassed ? 35.0 : 0.0;

        cardioDescription =
          `2.0-Kilometer Walk: ${formatTime(walkSeconds)} ` +
          `(maximum: ${formatTime(maximumPassingTime)})`;
      }

      const strengthReps = Number(document.getElementById("strengthReps").value);
      const strengthType = document.getElementById("strengthType").value;

      if (!Number.isFinite(strengthReps)) {
        alert("Enter valid muscular-strength repetitions.");
        return;
      }

      const strengthTable = strengthType === "pushup" ? PUSHUP_TABLE : HRPU_TABLE;
      const strengthPoints = lookupPerformanceScore(
        strengthTable,
        strengthReps,
        column
      );

      const strengthPassed = strengthPoints >= 2.5;

      const strengthDescription =
        strengthType === "pushup"
          ? `One-Minute Push-ups: ${strengthReps} repetitions`
          : `Hand-Release Push-ups: ${strengthReps} repetitions`;

      let corePoints = 0;
      let coreDescription = "";

      const coreType = document.getElementById("coreType").value;

      if (coreType === "plank") {
        const minutes = Number(document.getElementById("plankMinutes").value);
        const seconds = Number(document.getElementById("plankSeconds").value);

        if (seconds < 0 || seconds > 59 || !Number.isFinite(minutes)) {
          alert("Enter a valid forearm-plank duration.");
          return;
        }

        const plankSeconds = timeToSeconds(minutes, seconds);
        corePoints = lookupPerformanceScore(PLANK_TABLE, plankSeconds, column);
        coreDescription = `Timed Forearm Plank: ${formatTime(plankSeconds)}`;

      } else {
        const coreReps = Number(document.getElementById("coreReps").value);

        if (!Number.isFinite(coreReps)) {
          alert("Enter valid core-endurance repetitions.");
          return;
        }

        const coreTable = coreType === "situp" ? SITUP_TABLE : CRUNCH_TABLE;
        corePoints = lookupPerformanceScore(coreTable, coreReps, column);

        coreDescription =
          coreType === "situp"
            ? `One-Minute Sit-ups: ${coreReps} repetitions`
            : `Cross-Leg Reverse Crunches: ${coreReps} repetitions`;
      }

      const corePassed = corePoints >= 2.5;
      const totalScore = cardioPoints + whtrPoints + strengthPoints + corePoints;

      const overallPass =
        totalScore >= 75.0 &&
        cardioPassed &&
        strengthPassed &&
        corePassed;

      results.style.display = "block";
      results.innerHTML = `
        <h2>PFRA Results</h2>

        <p>
          Age: <strong>${age}</strong> |
          Age Band: <strong>${AGE_BANDS[ageBand].label}</strong> |
          Sex: <strong>${sex === "M" ? "Male" : "Female"}</strong> |
          WHtR: <strong>${whtr.toFixed(2)}</strong>
        </p>

        <table>
          <thead>
            <tr>
              <th>Component</th>
              <th>Performance</th>
              <th class="points">Points</th>
            </tr>
          </thead>

          <tbody>
            <tr>
              <td>Cardiorespiratory Fitness</td>
              <td>${cardioDescription}</td>
              <td class="points">${cardioPoints.toFixed(1)}</td>
            </tr>

            <tr>
              <td>Waist-to-Height Ratio</td>
              <td>WHtR = ${whtr.toFixed(2)}</td>
              <td class="points">${whtrPoints.toFixed(1)}</td>
            </tr>

            <tr>
              <td>Muscular Strength</td>
              <td>${strengthDescription}</td>
              <td class="points">${strengthPoints.toFixed(1)}</td>
            </tr>

            <tr>
              <td>Core Endurance</td>
              <td>${coreDescription}</td>
              <td class="points">${corePoints.toFixed(1)}</td>
            </tr>

            <tr>
              <td colspan="2"><strong>Total Score</strong></td>
              <td class="points"><strong>${totalScore.toFixed(1)} / 100</strong></td>
            </tr>
          </tbody>
        </table>

        <div class="${overallPass ? "good" : "bad"}">
          ${
            overallPass
              ? "OVERALL RESULT: SATISFACTORY"
              : "OVERALL RESULT: UNSATISFACTORY"
          }
          <br><br>
          A satisfactory result requires a total score of at least 75.0,
          cardio performance meeting the 35.0-point minimum, and strength
          and core performance meeting their respective 2.5-point minimums.
        </div>

        <div class="warning">
          This calculator uses direct threshold lookup. Validate the embedded
          threshold data against the current official PFRA scoring chart and
          applicable local procedures before using any result for an official
          assessment or administrative action.
        </div>
      `;

      results.scrollIntoView({ behavior: "smooth" });
    });
  </script>
